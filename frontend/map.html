<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЭкоГомель — Карта пунктов приёма</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ==================== 1. ПЕРЕМЕННЫЕ И СБРОС ==================== */
    :root {
      --bg-dark: #0d1210;
      --bg-card: #141c18;
      --bg-card-hover: #1b2621;
      --bg-input: #0a0e0c;

      --accent-green: #206746;
      --accent-green-hover: #298259;
      --accent-light: #25d366;

      --text-main: #e2e8f0;
      --text-muted: #8c9ba5;
      --border-color: #23302a;

      --radius-sm: 8px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    /* ==================== 2. ШАПКА ==================== */
    .header {
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header__container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .nav {
      display: flex;
      gap: 24px;
    }

    .nav__link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav__link:hover,
    .nav__link.active {
      color: #fff;
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 4px;
    }

    /* ==================== 3. СТРАНИЦА КАРТЫ ==================== */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    /* Сайдбар */
    #sidebar {
      width: 360px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .search-box {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-light);
    }

    .filters {
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .filters button {
      padding: 6px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .filters button:hover {
      border-color: var(--accent-light);
      color: #fff;
    }

    .filters button.active {
      background-color: var(--accent-green);
      color: #fff;
      border-color: var(--accent-green);
    }

    .actions {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .actions button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.2s;
    }

    #addModeBtn {
      background-color: var(--accent-green);
      color: #fff;
    }

    #addModeBtn:hover {
      background-color: var(--accent-green-hover);
    }

    #addModeBtn.active {
      background-color: #d97706;
      color: #fff;
    }

    #clearAllBtn {
      background-color: #dc2626;
      color: #fff;
    }

    #clearAllBtn:hover {
      opacity: 0.9;
    }

    #points-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .point-card {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .point-card:hover {
      background-color: var(--bg-card-hover);
    }

    .point-card.active {
      background-color: var(--bg-card-hover);
      border-left: 4px solid var(--accent-light);
    }

    .point-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .point-address {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .point-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .point-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .point-tags span {
      padding: 2px 6px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--accent-light);
      border-radius: 4px;
      font-size: 0.7rem;
    }

    /* Карта */
    #map {
      flex: 1;
      height: 100%;
      background-color: var(--bg-dark);
    }

    /* Popup Leaflet */
    .leaflet-popup-content-wrapper {
      background-color: var(--bg-card);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .leaflet-popup-tip {
      background-color: var(--bg-card);
    }

    .popup-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .popup-address {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .popup-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .popup-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .popup-tags span {
      padding: 2px 6px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--accent-light);
      border-radius: 3px;
      font-size: 0.7rem;
    }

    .popup-delete {
      margin-top: 8px;
      padding: 4px 10px;
      background-color: #dc2626;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
    }

    /* Кастомный маркер */
    .custom-marker {
      width: 18px;
      height: 18px;
      background-color: var(--accent-light);
      border: 2px solid var(--bg-dark);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(37, 211, 102, 0.6);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ШАПКА -->
  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">♻ ЭкоГомель</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Поиск</a>
        <a href="map.html" class="nav__link active">Карта</a>
        <a href="about_project.html" class="nav__link">О проекте</a>
      </nav>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="main-layout">
    <aside id="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по названию или адресу..." />
      </div>

      <div class="filters" id="filtersContainer">
        <button class="active" data-filter="all">Все</button>
        <button data-filter="Пластик">Пластик</button>
        <button data-filter="Стекло">Стекло</button>
        <button data-filter="Макулатура">Макулатура</button>
        <button data-filter="Батарейки">Батарейки</button>
        <button data-filter="Электроника">Электроника</button>
        <button data-filter="Металлолом">Металлолом</button>
      </div>

      <div class="actions">
        <button id="addModeBtn">➕ Добавить точку</button>
        <button id="clearAllBtn">🗑 Удалить все</button>
      </div>

      <div id="points-list"></div>
    </aside>

    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ============================================================

    const INITIAL_POINTS = [

      { id: 3, name: "ЧТУП «Гомелькоопвторресурсы»", address: "г. Гомель, ул. Головацкого, 96", latitude: 52.4503, longitude: 31.0181, accepted_types: ["Макулатура", "Стекло", "Металлолом", "Пластик"], working_hours: "Пн-Пт 08:00-16:00, Вс 08:00-16:00", description: "Пункт заготовки вторичного сырья в Центральном районе." },
      { id: 4, name: "ЧТУП «Гомелькоопвторресурсы»", address: "г. Гомель, ул. Тельмана, 6", latitude: 52.4347, longitude: 31.0135, accepted_types: ["Макулатура", "Стеклотара", "Пластик"], working_hours: "Пн-Пт 07:00-14:30", description: "Приемно-заготовительный пункт рядом с центром." },
      { id: 5, name: "ЧТУП «Гомелькоопвторресурсы»", address: "г. Гомель, ул. Царикова, 53", latitude: 52.4414, longitude: 30.9572, accepted_types: ["Макулатура", "Стеклобой", "Пластик PET", "Металлолом"], working_hours: "Пн-Пт 08:30-16:30, Сб 08:30-13:30", description: "Заготовительный киоск в районе Сельмаша." },
      { id: 6, name: "ЧТУП «Гомелькоопвторресурсы»", address: "г. Гомель, ул. Жемчужная", latitude: 52.3703, longitude: 31.0264, accepted_types: ["Макулатура", "Стеклотара", "Пластик"], working_hours: "Пн-Пт 08:30-16:00, Сб 08:30-13:30", description: "Пункт приема вторсырья в Новобелицком районе." },
      { id: 7, name: "ЧТУП «Гомелькоопвторресурсы»", address: "г. Гомель, ул. Братьев Лизюковых, 28", latitude: 52.4069, longitude: 30.9419, accepted_types: ["Макулатура", "Стекло", "Пластик"], working_hours: "Пн-Пт 08:30-16:30, Сб 08:30-14:00", description: "Удобная точка приема в Советском районе." },
      { id: 8, name: "Приемный пункт КУП «Спецкоммунтранс»", address: "г. Гомель, ул. Маневича, 2", latitude: 52.4828, longitude: 30.9997, accepted_types: ["Пластик PET", "Макулатура", "Стекло", "Полимеры"], working_hours: "Пн-Вс 09:00-17:00", description: "Специализированный стационарный пункт." },
      { id: 9, name: "Главная база КУП «Спецкоммунтранс»", address: "г. Гомель, ул. Аграрная, 1", latitude: 52.4632, longitude: 30.9944, accepted_types: ["Пластик PET", "Макулатура", "Стекло", "Изношенные шины", "Крупногабаритные отходы"], working_hours: "Пн-Чт 08:00-16:50, Пт 08:00-16:00", description: "Центральный офис и заготовительная база." },
      { id: 10, name: "ОАО «Гомельхимторг»", address: "г. Гомель, ул. Могилевская, 20", latitude: 52.4741, longitude: 30.9782, accepted_types: ["Макулатура", "Стекло", "Полимерные отходы", "Металлолом", "Изношенные шины", "Электроника", "Аккумуляторы"], working_hours: "Пн-Пт 08:00-17:00, Обед 12:00-13:00", description: "Универсальный пункт приема широкого спектра отходов." },
      { id: 11, name: "Гомельский цех ОАО «Белцветмет»", address: "г. Гомель, ул. Могилевская, 2А", latitude: 52.4639, longitude: 30.9664, accepted_types: ["Металлолом", "Аккумуляторы"], working_hours: "Пн-Чт 08:00-16:00, Пт 08:00-15:00", description: "Специализированное предприятие по приему цветных металлов." },
      { id: 12, name: "ООО «БелВторОтходы»", address: "г. Гомель, ул. Борисенко, 7/2", latitude: 52.4045, longitude: 30.9061, accepted_types: ["Электроника", "Бытовая техника", "Батарейки"], working_hours: "Пн-Пт 08:30-17:00", description: "Пункт сбора отработанного электронного оборудования." },
      { id: 13, name: "Приемный пункт стеклотары и макулатуры", address: "г. Гомель, ул. Кожара, 42", latitude: 52.4542, longitude: 31.0028, accepted_types: ["Стеклотара", "Стеклобой", "Макулатура"], working_hours: "Пн-Пт 09:00-16:30, Сб 09:00-14:00", description: "Пункт шаговой доступности в Железнодорожном районе." },
      { id: 14, name: "Эко-контейнер в «Евроопт» (Хатаевича)", address: "г. Гомель, ул. Хатаевича, 9", latitude: 52.4431, longitude: 31.0165, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-23:00", description: "Специальный эко-контейнер для элементов питания и ламп." },
      { id: 15, name: "Эко-контейнер в «Евроопт» (Ефремова)", address: "г. Гомель, ул. Ефремова, 11-1", latitude: 52.4618, longitude: 30.9658, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-22:00", description: "Контейнер для сбора люминесцентных ламп и батареек." },
      { id: 16, name: "Эко-контейнер в ТЦ «Евроопт» (Владимирова)", address: "г. Гомель, ул. Владимирова, 16", latitude: 52.4211, longitude: 30.9329, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-22:00", description: "Эко-бокс для мелких опасных отходов." },
      { id: 17, name: "Эко-контейнер в «Евроопт» (Свиридова)", address: "г. Гомель, ул. Свиридова, 15-1", latitude: 52.4746, longitude: 31.0255, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-22:00", description: "Пункт сбора батареек и ламп в Клёнковском." },
      { id: 18, name: "Эко-контейнер в ТЦ «МАНДАРИН ПЛАЗА»", address: "г. Гомель, Речицкий проспект, 5В", latitude: 52.4056, longitude: 30.9381, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 10:00-21:00", description: "Эко-контейнер для ртутьсодержащих ламп и батареек." }
    ];

    /* ============================================================
       2. КОНФИГУРАЦИЯ (для будущего API)
       ============================================================ */
    const DATA_SOURCE = 'local';                                 // 'local' | 'api'
    const API_URL = 'http://localhost:8000/api/v1/points';
    const LS_KEY = 'ecogomel_points';

    /* ============================================================
       3. РАБОТА С ДАННЫМИ (заглушка API)
       ============================================================ */
    async function getPoints() {
      if (DATA_SOURCE === 'api') {
        const res = await fetch(API_URL);
        return await res.json();
      }
      const saved = localStorage.getItem(LS_KEY);
      if (saved) return JSON.parse(saved);
      return JSON.parse(JSON.stringify(INITIAL_POINTS));
    }

    function savePointsLocal(list) {
      if (DATA_SOURCE === 'local') {
        localStorage.setItem(LS_KEY, JSON.stringify(list));
      }
    }

    async function apiAddPoint(point) {
      if (DATA_SOURCE === 'api') {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(point)
        });
        return await res.json();
      }
      point.id = Date.now();
      return point;
    }

    async function apiDeletePoint(id) {
      if (DATA_SOURCE === 'api') {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      }
    }

    /* ============================================================
       4. СОСТОЯНИЕ
       ============================================================ */
    let points = [];
    const markerMap = {};
    let activeFilter = 'all';
    let searchText = '';
    let addMode = false;

    /* ============================================================
       5. КАРТА
       ============================================================ */
    const map = L.map('map', { zoomControl: false })
      .setView([52.4345, 30.9754], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      subdomains: 'abc',
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const greenIcon = L.divIcon({
      className: '',
      html: '<div class="custom-marker"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -10]
    });

    /* ============================================================
       6. МАРКЕРЫ
       ============================================================ */
    function addMarker(p) {
      const marker = L.marker([p.latitude, p.longitude], { icon: greenIcon }).addTo(map);
      marker.bindPopup(buildPopup(p));
      marker.on('click', () => highlightCard(p.id));
      markerMap[p.id] = marker;
    }

    function buildPopup(p) {
      const tags = (p.accepted_types || [])
        .map(t => `<span>${t}</span>`).join('');

      return `
      <div style="min-width:220px">
        <div class="popup-title">${p.name}</div>
        <div class="popup-address">${p.address}</div>
        <div class="popup-tags">${tags}</div>
        <div class="popup-hours">${p.working_hours}</div>
        <div class="popup-desc">${p.description || ''}</div>
        <button class="popup-delete" onclick="deletePoint(${p.id})">
          Удалить точку
        </button>
      </div>`;
    }

    /* ============================================================
       7. СПИСОК ТОЧЕК
       ============================================================ */
    const listEl = document.getElementById('points-list');

    function renderList() {
      const filtered = points.filter(p => {
        const matchType = activeFilter === 'all' ||
          (p.accepted_types || []).some(t =>
            t.toLowerCase().includes(activeFilter.toLowerCase()));

        const matchText = searchText === '' ||
          p.name.toLowerCase().includes(searchText) ||
          p.address.toLowerCase().includes(searchText);

        return matchType && matchText;
      });

      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML =
          '<div style="padding:20px;color:var(--text-muted);text-align:center">' +
          'Ничего не найдено</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'point-card';
        card.dataset.id = p.id;

        const tags = (p.accepted_types || []).slice(0, 4)
          .map(t => `<span>${t}</span>`).join('');

        card.innerHTML = `
        <div class="point-name">${p.name}</div>
        <div class="point-address">${p.address}</div>
        <div class="point-tags">${tags}</div>
        <div class="point-hours">${p.working_hours}</div>`;

        card.addEventListener('click', () => {
          map.setView([p.latitude, p.longitude], 15);
          markerMap[p.id].openPopup();
          highlightCard(p.id);
        });

        listEl.appendChild(card);
      });
    }

    function highlightCard(id) {
      document.querySelectorAll('.point-card')
        .forEach(c => c.classList.remove('active'));

      const card = document.querySelector(`.point-card[data-id="${id}"]`);
      if (card) {
        card.classList.add('active');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    /* ============================================================
       8. ДОБАВЛЕНИЕ ТОЧКИ
       ============================================================ */
    const addModeBtn = document.getElementById('addModeBtn');

    addModeBtn.addEventListener('click', function () {
      addMode = !addMode;
      this.classList.toggle('active', addMode);
      this.textContent = addMode ? '📍 Кликните на карту' : '➕ Добавить точку';
    });

    map.on('click', async function (e) {
      if (!addMode) return;

      const name = prompt('Название точки:');
      if (!name) return;

      const newPoint = {
        name: name,
        address: prompt('Адрес:') || '—',
        latitude: e.latlng.lat,
        longitude: e.latlng.lng,
        accepted_types: (prompt('Что принимают (через запятую):') || '')
          .split(',').map(s => s.trim()).filter(Boolean),
        working_hours: prompt('Часы работы:') || '—',
        description: prompt('Описание:') || ''
      };

      const saved = await apiAddPoint(newPoint);
      points.push(saved);
      savePointsLocal(points);

      addMarker(saved);
      renderList();

      addMode = false;
      addModeBtn.classList.remove('active');
      addModeBtn.textContent = '➕ Добавить точку';
    });

    /* ============================================================
       9. УДАЛЕНИЕ ТОЧКИ
       ============================================================ */
    async function deletePoint(id) {
      if (!confirm('Удалить эту точку?')) return;

      if (markerMap[id]) {
        map.removeLayer(markerMap[id]);
        delete markerMap[id];
      }

      await apiDeletePoint(id);

      points = points.filter(p => p.id !== id);
      savePointsLocal(points);
      renderList();
    }

    window.deletePoint = deletePoint;

    document.getElementById('clearAllBtn').addEventListener('click', async function () {
      if (!confirm('Удалить ВСЕ точки с карты?')) return;

      for (const p of points) await apiDeletePoint(p.id);

      Object.values(markerMap).forEach(m => map.removeLayer(m));
      Object.keys(markerMap).forEach(k => delete markerMap[k]);

      points = [];
      savePointsLocal(points);
      renderList();
    });

    /* ============================================================
       10. ФИЛЬТРЫ И ПОИСК
       ============================================================ */
    document.querySelectorAll('#filtersContainer button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filtersContainer button')
          .forEach(b => b.classList.remove('active'));

        btn.classList.add('active');
        activeFilter = btn.dataset.filter;      // ← у них data-filter
        renderList();
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchText = e.target.value.trim().toLowerCase();
      renderList();
    });

    /* ============================================================
       11. ЗАПУСК
       ============================================================ */
    (async function init() {
      points = await getPoints();
      points.forEach(p => addMarker(p));
      renderList();
    })();
  </script>
</body>

</html>
